<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Minha Loja Online</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <header style="text-align: center; padding: 40px 0">
      <h1>🛍️Leva que Eu Não Quero Mais</h1>
      <p>As melhores ofertas você encontra aqui</p>
    </header>

    <main id="vitrine"></main>
    <section class="carrinho-container">
      <h2>🛍️ Meu Carrinho</h2>
      <ul id="lista-carrinho">
        <p>Seu carrinho está vazio.</p>
      </ul>
      <div class="carrinho-total">
        <strong>Total: <span id="valor-total">R$ 0,00</span></strong>
      </div>
      <button onclick="finalizarCompra()" class="btn-finalizar">
        Finalizar Pedido
      </button>
      <button onclick="esvaziarCarrinho()" class="btn-limpar">
        Limpar Carrinho
      </button>
    </section>
    <footer class="loja-footer">
      <p>
        Gerenciamento interno:
        <a href="admin.html" class="link-admin">Área do Lojista</a>
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
